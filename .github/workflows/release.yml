name: release

# Publishes to npm on every push to master when package.json
# holds a version that is not published yet.
# Auth is tokenless via npm trusted publisher (OIDC), see package settings on npmjs.com.
on:
  push:
    branches: [master]

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    env:
      HUSKY: 0
      NODE_VERSION: 24.x

    permissions:
      id-token: write # Required to mint token for npm package provenance
      contents: write # Needed to create and write release notes in GitHub release
    
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Dependencies
      run: npm install

    - name: Lint Files
      run: npm run lint

    - name: Build Project
      run: npm run build

    - name: Run Tests
      env:
        CI: true
      run: npm run test
    
    - name: Publish to NPM
      run: |
        PKG_NAME=$(node -p "require('./package.json').name")
        PKG_VERSION=$(node -p "require('./package.json').version")
        if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
          echo "$PKG_NAME@$PKG_VERSION already published, skipping."
        else
          npm publish --provenance
        fi
